      - {name: "V3-2025.R2-WP-1.zip", basin: WP, channel: 1, size: "59.0 GB", sha256: "c439934cf66d5d1e856eca20c881a270538b210d1158c435757256ceafbc9687"}
      - {name: "V3-2025.R2-WP-2.zip", basin: WP, channel: 2, size: "44.4 GB", sha256: "82acfde04844e7a279f425eb0eed7e1556b8cbacf90e538c171423c3cc034a25"}
      - {name: "V3-2025.R2-WP-3.zip", basin: WP, channel: 3, size: "26.3 GB", sha256: "1ee921c651b018b63f590c0f37767f42e6ac79d79ca116e3fb8119b08e46da3b"}
