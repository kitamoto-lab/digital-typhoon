caveats:
  - item: "Images over the 30% missing-area limit in V3-2025.R2 (known issue)"
    detail: |
      174 Himawari-5 (GMS-5) images have mask_N_pct > 0.3. They are listed in known_issues/mask_over_30pct_V3-2025.R2.csv
      and will be corrected in a future release.
      (1) Southern part not scanned: 168 images (AU, channel 1: 48, channel 2: 56, channel 3: 64; 11 sequences, 2001-12 to 2003-04, 13-17°S).
          The bottom of the image is filled with 130.0 K, with a band of corrupted scan lines above it. All were taken at hours that are not
          multiples of three (01, 02, 04, 07, 08, 10, 13, 14, 19, 20, 22 UTC). mask_N counts only the filled pixels, not the corrupted lines,
          so the unusable area is larger than mask_N_pct.
      (2) Edge of the Earth's disk: 6 images (WP 199605, 1996-07-16 14-15 UTC, 54°N 175°E; AU 200013, 2000-03-29 09 UTC, 72°E; channels 1 and 2).
          The masked area is space beyond the edge of the disk, not missing data, but it is counted in mask_N.
      To exclude them, pass the file names in the list to pyphoon3's ignore_list (for multi-channel loading, the names without the channel suffix).
    severity: "warning"
  - item: "Seasonal updates can change past data"
    detail: "Past seasons may be corrected when a new season is added. Record the release name (e.g. V3-2025.R2) to make experiments reproducible."
    severity: "warning"
  - item: "The V3 paper's benchmarks were computed on V3-2025.R1"
    detail: "The public release is R2. According to Appendix A of the paper, the image counts differ only by 23 AU images in channels 1 and 2, and the median evaluation RMSE over epochs 41-50 changes little (e.g. WP-1: 6.63 -> 6.54 hPa); the paper concludes that its results remain representative for R2. Exact reproduction requires R1, available on request."
    severity: "info"
