      - {name: "V3-2025.R2-AU-4.zip", basin: AU, channel: 4, size: "14.7 GB", sha256: "58787e54961050a18ba275427aba519a062954835d4c4a5029c2b5d9971a75be"}
      - {name: "substituted_conversion.csv", note: "List of the 1,477 images converted with substituted calibration coefficients or conversion tables"}
