# Operational metadata: Digital Typhoon Dataset V3 (dataset)
# Describes release V3-2025.R2. Companion file: library.yaml (pyphoon3).
# Sources: the V3 dataset page, the V3 paper (arXiv:2610.21654), and inspection of the released data.
# Generated: 2026-11-20
# License: CC BY 4.0

schema_version: "0.1.0"

dataset:
  name: "Digital Typhoon Dataset V3"
  version: "V3-2025.R2"
  doi: "10.20783/DIAS.664"
  license: "CC BY 4.0"
  url: "https://agora.ex.nii.ac.jp/digital-typhoon/dataset/V3/"
  repository_url: "https://search.diasjp.net/en/dataset/DigitalTyphoon"  # DOI landing page (DIAS)
  release_date: "2026-10-16"

  creators:
    - name: "Kitamoto, Asanobu"
      affiliation: "National Institute of Informatics"

  description: |
    Version 3 of the Digital Typhoon Dataset: typhoon-centered satellite images (brightness temperature)
    from geostationary satellites (Himawari series and GOES-9), paired hourly with best-track data.
    V3 covers two basins (WP: Western North Pacific, AU: Australian region) and four satellite channels.
    Each tropical cyclone (sequence) has a directory of images and a track CSV file.

  citation: "Digital Typhoon Dataset V3 (National Institute of Informatics), doi:10.20783/DIAS.664"
  papers:
    - "Asanobu Kitamoto, Victor Le Louarn, Noelia Falczuk, Ngoc Anh Tong, Anja Veleva. Digital Typhoon Dataset V3: Benchmarking for Multi-spectral Extension and Analyzing Systematic Bias in Intensity Regression. arXiv:2610.21654, 2026. (V3)"
    - "Asanobu Kitamoto, Erwan Dzik, Gaspar Faure. Machine Learning for the Digital Typhoon Dataset: Extensions to Multiple Basins and New Developments in Representations and Tasks. arXiv:2411.16421, 2024. (V2)"
    - "Asanobu Kitamoto, Jared Hwang, Bastien Vuillod, Lucas Gautier, Yingtao Tian, Tarin Clanuwat. Digital Typhoon: Long-term Satellite Image Dataset for the Spatio-Temporal Modeling of Tropical Cyclones. NeurIPS 2023 Datasets and Benchmarks. arXiv:2311.02665. (V1)"

  releases:
    - name: "V3-2025.R2"
      status: "current (public)"
      note: "Corrects 4,102 images of R1: 4,056 blank images in channels 1-3 were regenerated and 46 mostly missing images in AU channels 1 and 2 were removed"
    - name: "V3-2025.R1"
      status: "not public (available on request)"
      note: "Release used for the benchmarks of the V3 paper"
  update_policy: "New seasons are added after each typhoon season ends (the following spring). Past seasons may also be corrected, so replace an old release with the new one."

  temporal_coverage:
    start: "1978-11-25"   # first track time (WP 197830, channel 1)
    end: "2025-12-03"     # last track time (WP 202527, 12 UTC); covers seasons up to 2025
    resolution: "1 hour"  # track rows are hourly (including interpolated rows); images around 1978 are 3-hourly

  spatial_coverage:
    description: "WP: Western North Pacific (Northern Hemisphere, JMA area of responsibility); AU: Australian region (Southern Hemisphere)"
    basins:
      - code: "WP"
        name: "Western North Pacific"
        best_track_source: "Japan Meteorological Agency (JMA) best track (the latest season uses preliminary data via NOAA)"
        latitude_range: [1.4, 69.0]      # observed in channel 1
        longitude_range: [97.5, 188.0]   # degrees east, 0-360
      - code: "AU"
        name: "Australian region"
        best_track_source: "Bureau of Meteorology, Australia"
        latitude_range: [-48.5, -2.7]
        longitude_range: [38.09, 212.1]  # degrees east, 0-360

  channels:
    # Wavelength bands in micrometres; center wavelength in parentheses.
    # Channels that overlap in wavelength get the same number across satellites. Visible channels are not included.
    - id: 1
      type: "Infrared 1"
      first_season: 1978
      note: "The channel of datasets V1 and V2; longest coverage"
      wavelength_um:
        Himawari-1/2/3/4: "10.5-12.5"
        Himawari-5: "10.5-11.5 (11.0)"
        GOES-9: "10.2-11.2 (10.7)"
        Himawari-6/7: "10.3-11.3 (10.8)"
        Himawari-8/9: "11.2±0.2"
    - id: 2
      type: "Infrared 2"
      first_season: 1995
      note: "Introduced with Himawari-5"
      wavelength_um:
        Himawari-5: "11.5-12.5 (12.0)"
        GOES-9: "11.5-12.4 (11.95)"
        Himawari-6/7: "11.5-12.5 (12.0)"
        Himawari-8/9: "12.35±0.3"
    - id: 3
      type: "Water vapor"
      first_season: 1995
      note: "Introduced with Himawari-5"
      wavelength_um:
        Himawari-5: "6.5-7.0 (6.75)"
        GOES-9: "6.5-7.0 (6.75)"
        Himawari-6/7: "6.5-7.0 (6.75)"
        Himawari-8/9: "6.25±0.37"
    - id: 4
      type: "Near infrared"
      first_season: 2005
      note: "Introduced with Himawari-6. Excluded from the multi-channel experiments of the V3 paper because of its distinct spectral and diurnal characteristics"
      wavelength_um:
        Himawari-6/7: "3.5-4.0 (3.75)"
        Himawari-8/9: "3.85±0.22"

  satellites:  # satellite code in image file names -> satellite
    GMS1: "Himawari-1 (GMS)"
    GMS2: "Himawari-2 (GMS-2)"
    GMS3: "Himawari-3 (GMS-3)"
    GMS4: "Himawari-4 (GMS-4)"
    GMS5: "Himawari-5 (GMS-5)"
    GOE9: "GOES-9"
    MTS1: "Himawari-6 (MTSAT-1R)"
    MTS2: "Himawari-7 (MTSAT-2)"
    HMW8: "Himawari-8"
    HMW9: "Himawari-9"

  image:
    size: [512, 512]
    content: "Typhoon-centered brightness temperature image (K)"
    projection: "Azimuthal equidistant, centered on the best-track position"
    missing_area_rule: "Images with more than 30% of the area missing are excluded. V3-2025.R2 still contains some images over this limit (see caveats)."

  statistics:  # counts from the V3 dataset page (cyclones / images); track CSV rows also include rows without images
    total_typhoons: 1680
    total_images: 818881
    per_channel:
      - {channel: 1, basin: WP, typhoons: 1169, images: 202986, track_rows: 236237, seasons: "1978-2025"}
      - {channel: 1, basin: AU, typhoons: 511,  images: 76188,  track_rows: 91381,  seasons: "1979-2025"}
      - {channel: 2, basin: WP, typhoons: 744,  images: 142583, track_rows: 146163, seasons: "1995-2025"}
      - {channel: 2, basin: AU, typhoons: 339,  images: 58842,  track_rows: 60624,  seasons: "1995-2025"}
      - {channel: 3, basin: WP, typhoons: 744,  images: 142591, track_rows: 146163, seasons: "1995-2025"}
      - {channel: 3, basin: AU, typhoons: 339,  images: 58842,  track_rows: 60624,  seasons: "1995-2025"}
      - {channel: 4, basin: WP, typhoons: 502,  images: 96611,  track_rows: 97087,  seasons: "2005-2025"}
      - {channel: 4, basin: AU, typhoons: 223,  images: 40238,  track_rows: 40508,  seasons: "2005-2025"}

